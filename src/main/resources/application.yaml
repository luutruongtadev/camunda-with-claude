server:
  port: 8081            # 8080 đã bị c8run chiếm (REST API + Operate/Tasklist)

camunda:
  client:
    mode: self-managed
    rest-address: http://localhost:8080
    grpc-address: http://localhost:26500
    # c8run mặc định: basic auth, API unprotected -> không cần credentials
    # nếu bật protect API:
    # auth:
    #   method: basic
    #   username: demo
    #   password: demo
    worker:
      defaults:
        max-jobs-active: 32
        stream-enabled: true   # job push streaming thay vì long-polling
